name: Upstream Sync

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PW main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/jos3phburns-afk/Homebridge-harvia.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing upstream sync PR
        if: steps.detect.outputs.changed == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list             --base main             --state open             --search 'chore: sync upstream Homebridge-harvia in:title'             --json number             --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into proposal branch
        if: steps.detect.outputs.changed == 'true' && steps.existing.outputs.count == '0'
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/upstream-sync-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Upstream merge has conflicts. Manual review is required."
            exit 1
          fi

          npm install --no-audit --no-fund
          npm run verify:pw
          npm run build

          git push origin "$branch"

          cat > /tmp/upstream-pr-body.md <<'EOF'
          Automated proposal to merge the latest `jos3phburns-afk/Homebridge-harvia:main` into the PW-maintained fork.

          Automated checks completed before this PR was opened:
          - PW temperature-sensor integrity check
          - TypeScript build

          Runtime/HomeKit verification is still required before a PW npm release.
          EOF

          gh pr create             --base main             --head "$branch"             --title "chore: sync upstream Homebridge-harvia"             --body-file /tmp/upstream-pr-body.md             --assignee PeterWestermann

      - name: Report existing sync PR
        if: steps.detect.outputs.changed == 'true' && steps.existing.outputs.count != '0'
        run: |
          echo "An upstream sync PR is already open. No duplicate PR was created."
